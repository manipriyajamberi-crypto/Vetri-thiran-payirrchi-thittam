<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ComicCraft - AI Comic Creator
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="page">

    <section class="hero">

        <div class="eyebrow">
            AI COMIC STORY CREATOR
        </div>

        <h1>
            Turn Your Idea Into a Comic
        </h1>

        <p class="subtitle">

            Describe your story and let AI create
            a five-panel comic with narration,
            dialogue and illustrations.

        </p>

    </section>


    {% if error %}

    <div class="alert">

        {{ error }}

    </div>

    {% endif %}


    <form
        class="card form-card"
        action="/generate"
        method="POST"
    >

        <label>

            Story Prompt

            <textarea
                name="story_prompt"
                rows="5"
                required
                placeholder="Example: A brave fox explores an enchanted forest and discovers a hidden library."
            ></textarea>

        </label>


        <div class="grid two">

            <label>

                Main Character Name

                <input
                    type="text"
                    name="character_name"
                    placeholder="Luna"
                    required
                >

            </label>


            <label>

                Setting

                <select name="setting">

                    <option>
                        Forest
                    </option>

                    <option>
                        School
                    </option>

                    <option>
                        Space
                    </option>

                    <option>
                        City
                    </option>

                    <option>
                        Fantasy Kingdom
                    </option>

                </select>

            </label>

        </div>


        <div class="grid two">

            <label>

                Story Tone

                <select name="tone">

                    <option>
                        Light-hearted
                    </option>

                    <option>
                        Dramatic
                    </option>

                    <option>
                        Poetic
                    </option>

                    <option>
                        Funny
                    </option>

                    <option>
                        Adventurous
                    </option>

                </select>

            </label>


            <label>

                Art Style

                <select name="art_style">

                    <option>
                        Anime
                    </option>

                    <option>
                        Pixel art
                    </option>

                    <option>
                        Comic book
                    </option>

                    <option>
                        Realistic
                    </option>

                    <option>
                        Watercolor
                    </option>

                </select>

            </label>

        </div>


        <button
            class="button primary"
            type="submit"
        >

            ✨ Generate My Comic

        </button>

    </form>


    <p class="small-note">

        AI generation may take a few minutes
        because five illustrations are generated.

    </p>

</main>

</body>

</html>
